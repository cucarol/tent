name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.19.0', '24.22.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run security:audit
      - name: Full check including SQLite storage and six safety cases
        run: npm run check
      - name: Scan bounded propagation sequences
        if: runner.os == 'Linux'
        run: TENT_PROPAGATION_SEED="$(seq -s, 100 129),$(seq -s, 200 299)" node --import tsx --test test/propagation-sequences.test.ts
